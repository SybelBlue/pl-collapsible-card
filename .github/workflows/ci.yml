name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  UV_CACHE_DIR: /tmp/learnvia-uv-cache

jobs:
  check:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.6'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: make deps-install

      - name: Fetch pull-request base
        if: github.event_name == 'pull_request'
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$PULL_REQUEST_BASE_SHA"

      - name: Run checks
        env:
          # Outside pull requests, the full suite still runs; the diff is empty.
          E2E_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          E2E_DIFF_HEAD: ${{ github.sha }}
          E2E_FUZZ_SEED: ${{ github.run_id }}
        run: make check

  release:
    name: Publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out main with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.6'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install development tools
        run: uv sync --locked --only-dev

      - name: Verify vendored dependencies
        run: uv run --locked --no-sync pl-vendor check installed

      - name: Fetch the current release branch
        run: git fetch origin refs/heads/release:refs/remotes/origin/release || true

      - name: Rebuild and publish release
        run: uv run --locked --no-sync pl-vendor release build --push
