name: Update required vendored dependencies

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

concurrency:
  group: update-required-vendor
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  pull-requests: write

env:
  UPDATE_BRANCH: deps/required-vendor
  UV_CACHE_DIR: /tmp/learnvia-uv-cache

jobs:
  update:
    name: Update required vendor group
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.6'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: make deps-install

      - name: Check required vendor freshness
        id: freshness
        run: |
          if make vendor-check-required; then
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update required vendor group
        if: steps.freshness.outputs.update == 'true'
        id: update
        run: |
          old_revision=$(uv run --locked --no-sync pl-vendor list prairielearn-schemas | awk 'NR == 1 {print $2}')
          make vendor-update-required
          make vendor-verify
          new_revision=$(uv run --locked --no-sync pl-vendor list prairielearn-schemas | awk 'NR == 1 {print $2}')
          if [ -z "$old_revision" ] || [ -z "$new_revision" ]; then
            echo "Could not read the required PrairieLearn revisions." >&2
            exit 1
          fi
          if [ "$old_revision" = "$new_revision" ]; then
            echo "The freshness check failed, but the update produced no revision change." >&2
            exit 1
          fi
          echo "old_revision=$old_revision" >> "$GITHUB_OUTPUT"
          echo "new_revision=$new_revision" >> "$GITHUB_OUTPUT"

      - name: Run checks
        if: steps.freshness.outputs.update == 'true'
        env:
          E2E_DIFF_BASE: main
          E2E_DIFF_HEAD: HEAD
          E2E_FUZZ_SEED: ${{ github.run_id }}
        run: make check

      - name: Commit and push update
        if: steps.freshness.outputs.update == 'true'
        run: |
          git update-ref -d "refs/remotes/origin/$UPDATE_BRANCH"
          git fetch --no-tags origin \
            "+refs/heads/$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH" || true
          git switch -C "$UPDATE_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .prairielearn/schemas .htmlmustache plvendor.lock
          git commit -m "Update required vendored dependencies"
          git push --force-with-lease origin "HEAD:refs/heads/$UPDATE_BRANCH"

      - name: Open or refresh pull request
        if: steps.freshness.outputs.update == 'true'
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_REVISION: ${{ steps.update.outputs.old_revision }}
          NEW_REVISION: ${{ steps.update.outputs.new_revision }}
        run: |
          body_file="$RUNNER_TEMP/vendor-update-pr.md"
          {
            printf 'Updates the required PrairieLearn-derived vendor group.\n\n'
            printf -- "- Previous PrairieLearn revision: \`%s\`\n" "$OLD_REVISION"
            printf -- "- New PrairieLearn revision: \`%s\`\n\n" "$NEW_REVISION"
            printf "The update workflow ran \`make vendor-verify\` and \`make check\` before pushing.\n\n"
            printf "\`\`\`text\n"
            git diff --stat main...HEAD
            printf "\`\`\`\n"
          } > "$body_file"

          pull_request=$(gh pr list \
            --base main \
            --head "$UPDATE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')
          if [ -n "$pull_request" ]; then
            gh pr edit "$pull_request" \
              --title "Update required vendored dependencies" \
              --body-file "$body_file"
          else
            pull_request_url=$(gh pr create \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title "Update required vendored dependencies" \
              --body-file "$body_file")
            pull_request=${pull_request_url##*/}
          fi

          echo "number=$pull_request" >> "$GITHUB_OUTPUT"

          # Pushes made with GITHUB_TOKEN do not emit a pull_request event. Dispatch
          # the ordinary CI workflow explicitly so its Checks result is attached to
          # the update commit and can satisfy branch protection.
          gh workflow run CI --ref "$UPDATE_BRANCH"
